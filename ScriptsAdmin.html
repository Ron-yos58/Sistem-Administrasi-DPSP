App.handleAdminAction = async function (button) {
            var action, archiveYear, archiveConfirmation, result;
            if (!document.body.classList.contains('is-admin')) {
                this.toast('Aksi ini hanya untuk Admin.', true);
                return;
            }
            action = button.dataset.adminAction;
            this.setBusy(button, true, 'Memproses...');
            try {
                if (action === 'system-status') {
                    result = await this.server('getSystemStatus');

                    return;
                }

                    return;
                }
                if (action === 'preview-yearly-archive') {
                    archiveYear = new Date().getFullYear() - 1;

                    return;
