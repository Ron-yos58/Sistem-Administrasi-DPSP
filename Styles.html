<style>
  :root {
    --green-950: #002e2a;
    --green-900: #015850;
    --green-800: #087168;
    --green-700: #0b8479;
    --green-100: #dcece9;
    --green-50: #f0f7f5;
    --yellow: #fcc419;
    --yellow-hover: #fab005;
    --yellow-soft: #fff9db;
    --ink: #1e2927;
    --muted: #6b7c78;
    --line: #e2e9e7;
    --paper: #ffffff;
    --canvas: #f6f9f8;
    
    --danger: #b42318;
    --danger-soft: #fef3f2;
    --danger-border: #fee4e2;
    
    --warning: #b54708;
    --warning-soft: #fffaeb;
    --warning-border: #fef0c7;
    
    --success: #067647;
    --success-soft: #ecfdf3;
    --success-border: #d1fadf;

    --shadow-sm: 0 2px 6px rgba(0, 46, 42, .03);
    --shadow-md: 0 8px 24px rgba(0, 46, 42, .06);
    --shadow-lg: 0 20px 40px rgba(0, 46, 42, .09);
    
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 8px;
    --sidebar-width: 260px;
    
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ring: 0 0 0 4px rgba(8, 113, 104, .14);
  }

  * { box-sizing: border-box; }
  html { background: var(--canvas); scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 90% 0%, rgba(1, 88, 80, .05), transparent 30rem),
      var(--canvas);
    font-family: "Manrope", sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; border: 0; background: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--green-800);
    outline-offset: 2px;
    box-shadow: var(--ring);
  }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4, p { margin-top: 0; }
  h1, h2, h3, h4 { color: var(--ink); font-weight: 700; }
  h1 { margin-bottom: 0; font-size: 26px; letter-spacing: -.03em; }
  h2 { margin-bottom: 12px; font-family: "Newsreader", serif; font-size: 32px; line-height: 1.1; }
  h3 { margin-bottom: 8px; font-size: 17px; letter-spacing: -.02em; }
  .is-hidden { display: none !important; }
  .app-shell { min-height: 100vh; display: flex; }

  /* Ikon SVG Global */
  .icon-svg {
    width: 20px;
    height: 20px;
    stroke-width: 2;
    fill: none;
    stroke: currentColor;
    display: inline-block;
    vertical-align: middle;
  }
  .nav-icon-svg {
    width: 20px;
    height: 20px;
    stroke-width: 2;
    fill: none;
    stroke: currentColor;
  }

  .sidebar {
    position: fixed;
    z-index: 60;
    inset: 0 auto 0 0;
    display: flex;
    width: var(--sidebar-width);
    flex-direction: column;
    overflow-y: auto;
    padding: 24px 18px;
    color: #fff;
    background:
      linear-gradient(165deg, rgba(255,255,255,.05), transparent 45%),
      var(--green-950);
    box-shadow: 10px 0 30px rgba(0, 20, 18, .15);
    transform: translateX(-105%);
    transition: transform .3s var(--ease-out);
  }
  .sidebar.is-open { transform: translateX(0); }
  
  .sidebar-backdrop {
    position: fixed;
    z-index: 50;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    background: rgba(0, 25, 23, .45);
    backdrop-filter: blur(4px);
    transition: opacity .25s var(--ease-out);
  }
  .sidebar-backdrop.is-visible { pointer-events: auto; opacity: 1; }
  
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 4px 6px 28px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    margin-bottom: 20px;
  }
  .brand-mark {
    display: grid;
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    place-items: center;
    border-radius: 12px;
    color: var(--green-950);
    background: var(--yellow);
    font-family: "Newsreader", serif;
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
    box-shadow: 0 6px 16px rgba(252, 196, 25, .25);
  }
  .brand strong { display: block; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .brand span { display: block; margin-top: 1px; color: rgba(255,255,255,.55); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
  
  .main-nav { display: grid; gap: 5px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 46px;
    padding: 0 14px;
    border: 0;
    border-radius: 11px;
    color: rgba(255, 255, 255, .7);
    background: transparent;
    text-align: left;
    font-weight: 600;
    transition: color .2s var(--ease-out), background-color .2s var(--ease-out), transform .2s var(--ease-out);
  }
  .nav-item:hover { color: #fff; background: rgba(255,255,255,.06); transform: translateX(3px); }
  .nav-item:active { transform: translateX(1px) scale(.99); }
  .nav-item.is-active { color: var(--green-950); background: var(--yellow); }
  .nav-item.is-active:hover { color: var(--green-950); background: var(--yellow); }
  .nav-item.is-active .nav-icon-svg { stroke: var(--green-950); }
  .nav-icon { display: flex; width: 24px; height: 24px; align-items: center; justify-content: center; flex-shrink: 0; }
  
  .sidebar-foot { margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .version { padding: 0 8px; color: rgba(255,255,255,.35); font-size: 11px; font-family: monospace; }
  .credits {
    margin: 10px 8px 0;
    padding-top: 10px;
    color: rgba(255,255,255,.45);
    font-size: 10px;
    line-height: 1.5;
  }
  .credits strong { color: rgba(255,255,255,.75); font-size: 11px; }

  .workspace { min-height: 100vh; flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex;
    min-height: 76px;
    align-items: center;
    gap: 16px;
    padding: 16px clamp(16px, 4vw, 48px);
    border-bottom: 1px solid var(--line);
    background: rgba(246, 249, 248, .85);
    backdrop-filter: blur(16px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-actions { display: flex; min-width: 0; align-items: center; gap: 14px; margin-left: auto; }
  .topbar-user { 
    overflow: hidden; 
    max-width: 250px; 
    color: var(--muted); 
    font-size: 12px; 
    font-weight: 700; 
    text-overflow: ellipsis; 
    white-space: nowrap; 
    background: rgba(8, 113, 104, 0.06);
    padding: 6px 12px;
    border-radius: 99px;
    border: 1px solid rgba(8, 113, 104, 0.08);
  }
  body.is-admin .topbar-user {
    color: var(--green-900);
    border-color: rgba(8, 113, 104, 0.2);
    background: rgba(8, 113, 104, 0.1);
  }
  .menu-toggle { display: flex; }
  .eyebrow { margin-bottom: 6px; color: var(--green-800); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .main-content { width: 100%; max-width: 1400px; margin: 0 auto; padding: 24px clamp(16px, 4vw, 48px) 80px; flex: 1; }
  .view { display: none; animation: reveal .3s var(--ease-out) both; }
  .view.is-active { display: block; }
  @keyframes reveal { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* Tombol Premium */
  .button {
    display: inline-flex;
    min-height: 42px;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 18px;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    font-weight: 700;
    font-size: 13px;
    transition: all .2s var(--ease-out);
    box-shadow: var(--shadow-sm);
  }
  .button:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .button:active { transform: translateY(0) scale(.98); box-shadow: var(--shadow-sm); }
  .button:disabled { cursor: not-allowed; opacity: .6; transform: none !important; box-shadow: none !important; }
  
  .button-primary { color: #fff; background: var(--green-900); }
  .button-primary:hover { background: var(--green-800); }
  .button-secondary { border-color: var(--line); color: var(--ink); background: var(--paper); }
  .button-secondary:hover { background: var(--green-50); border-color: var(--green-100); color: var(--green-900); }
  .button-edit {
    border-color: #f0c24b;
    color: #7a4b00;
    background: #fff6d8;
  }
  .button-edit:hover {
    border-color: #e2ab17;
    color: #5f3900;
    background: #ffe8a3;
  }
  .button-finish {
    border-color: #0d7a67;
    color: #fff;
    background: #0f8f78;
  }
  .button-finish:hover {
    border-color: #0a6958;
    background: #0c7864;
  }
  .button-accent { color: var(--green-950); background: var(--yellow); }
  .button-accent:hover { background: var(--yellow-hover); }
  .button-danger { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-border); }
  .button-danger:hover { background: var(--danger); color: #fff; }
  .button-small { min-height: 34px; padding: 0 12px; font-size: 12px; border-radius: var(--radius-sm); }
  .button-full { width: 100%; }
  
  .text-button { 
    display: inline-flex; 
    align-items: center; 
    gap: 6px; 
    padding: 6px 12px; 
    border: 0; 
    border-radius: var(--radius-sm);
    color: var(--green-800); 
    background: transparent; 
    font-weight: 700; 
    transition: all .2s var(--ease-out); 
  }
  .text-button:hover { color: var(--green-900); background: var(--green-50); }
  
  .icon-button {
    display: grid;
    width: 42px;
    height: 42px;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    color: var(--ink);
    background: var(--paper);
    transition: all .2s var(--ease-out);
    box-shadow: var(--shadow-sm);
  }
  .icon-button:hover { border-color: var(--green-100); color: var(--green-900); background: var(--green-50); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .icon-button:active { transform: scale(.95); }
  .icon-button[aria-busy="true"] { opacity: 0.65; pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .sidebar-close { border-color: rgba(255,255,255,.12); color: rgba(255, 255, 255, 0.7); background: rgba(255,255,255,.05); }
  .sidebar-close:hover { border-color: rgba(255,255,255,0.3); color: #fff; background: rgba(255,255,255,.1); }
  body.sidebar-open { overflow: hidden; }

  /* Notice Banner */
  .notice { margin-bottom: 24px; padding: 16px 20px; border-radius: var(--radius-md); font-weight: 500; font-size: 13px; line-height: 1.6; border: 1px solid transparent; }
  .notice-error { border-color: var(--danger-border); color: var(--danger); background: var(--danger-soft); }

  /* Dashboard Metrics & Layout */
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 28px;
  }
  .metric-card {
    position: relative;
    overflow: hidden;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--paper);
    box-shadow: var(--shadow-sm);
    transition: all .25s var(--ease-out);
  }
  .metric-card:hover { border-color: var(--green-100); box-shadow: var(--shadow-md); transform: translateY(-4px); }
  .metric-card::after { 
    position: absolute; 
    right: -20px; 
    bottom: -30px; 
    width: 90px; 
    height: 90px; 
    border-radius: 50%; 
    background: var(--green-50); 
    opacity: 0.7;
    z-index: 0;
    content: ""; 
  }
  .metric-card * { position: relative; z-index: 1; }
  .metric-card strong { display: block; margin: 10px 0 4px; font-family: "Newsreader", serif; font-size: 38px; line-height: 1; font-weight: 700; color: var(--green-950); }
  .metric-card span { color: var(--muted); font-size: 12px; font-weight: 500; }
  .metric-card .metric-label { color: var(--green-800); font-weight: 800; letter-spacing: .05em; text-transform: uppercase; font-size: 10px; }

  .content-grid { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(320px, .9fr); gap: 24px; }
  
  /* Panel / Cards */
  .panel, .form-card, .review-card {
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--paper);
    box-shadow: var(--shadow-sm);
    transition: border-color .2s var(--ease-out), box-shadow .2s var(--ease-out);
  }
  .panel:hover, .form-card:hover, .review-card:hover { border-color: rgba(8, 113, 104, 0.2); box-shadow: var(--shadow-md); }
  .panel { padding: 28px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
  
  .request-list { display: grid; }
  .request-row {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(120px, .8fr) minmax(150px, auto) auto;
    align-items: center;
    gap: 20px;
    padding: 20px 0;
    border-top: 1px solid var(--line);
  }
  .request-row:first-child { border-top: 0; padding-top: 0; }
  .request-row strong { font-size: 14px; font-weight: 700; color: var(--ink); }
  .request-row span { display: block; font-size: 13px; font-weight: 600; }
  .request-row small { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
  
  .focus-panel { background: linear-gradient(180deg, #fff, var(--green-50)); }
  .workflow-list { display: grid; gap: 20px; margin: 24px 0 0; padding: 0; list-style: none; }
  .workflow-list li { display: flex; align-items: flex-start; gap: 14px; }
  .workflow-list li > span { display: grid; width: 32px; height: 32px; flex: 0 0 32px; place-items: center; border-radius: 10px; color: #fff; background: var(--green-900); font-weight: 800; font-size: 12px; }
  .workflow-list strong { display: block; font-size: 13px; font-weight: 700; }
  .workflow-list small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.4; }

  [data-admin-only] { display: none !important; }
  body.is-admin [data-admin-only] { display: flex !important; }
  body.is-admin section[data-admin-only] { display: none !important; }
  body.is-admin section[data-admin-only].is-active { display: block !important; }

  /* Toolbar */
  .section-toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .section-toolbar > .button { margin-left: auto; }
  .search-box { 
    display: flex; 
    width: min(420px, 100%); 
    min-height: 44px; 
    align-items: center; 
    gap: 10px; 
    padding: 0 16px; 
    border: 1px solid var(--line); 
    border-radius: var(--radius-md); 
    background: var(--paper); 
    transition: all 0.2s var(--ease-out);
  }
  .search-box:focus-within {
    border-color: var(--green-800);
    box-shadow: var(--ring);
  }
  .search-box svg { flex-shrink: 0; color: var(--muted); }
  .search-box input { width: 100%; border: 0; outline: 0; background: transparent; font-size: 13px; font-weight: 500; color: var(--ink); }
  
  .section-toolbar select { 
    min-height: 44px; 
    padding: 0 36px 0 14px; 
    border: 1px solid var(--line); 
    border-radius: var(--radius-md); 
    background: var(--paper); 
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
  }
  
  /* Tables */
  .table-panel { padding: 0; overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  .data-table { width: 100%; border-collapse: collapse; text-align: left; }
  .data-table th { padding: 14px 20px; color: var(--muted); background: var(--green-50); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .data-table td { padding: 18px 20px; border-top: 1px solid var(--line); vertical-align: top; font-size: 13px; }
  .data-table tbody tr { transition: background-color .15s var(--ease-out); }
  .data-table tbody tr:hover { background: rgba(240, 247, 245, 0.4); }
  .table-primary { display: block; max-width: 360px; font-weight: 700; color: var(--ink); }
  .table-secondary { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; font-weight: 500; }
  
  /* Status Badges */
  .status {
    display: inline-flex;
    min-height: 24px;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .02em;
    text-transform: uppercase;
    white-space: nowrap;
    border: 1px solid currentColor;
  }
  .status::before { width: 5px; height: 5px; border-radius: 50%; background: currentColor; content: ""; }
  
  .status-ready, .status-generated, .status-drafted, .status-active { color: var(--success); background: var(--success-soft); border-color: var(--success-border); }
  .status-draft, .status-pending { color: var(--warning); background: var(--warning-soft); border-color: var(--warning-border); }
  .status-error { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-border); }
  .status-archived { color: var(--muted); background: #f2f4f7; border-color: #eaecf0; }
  
  .status-stack { display: flex; flex-wrap: wrap; gap: 6px; }
  .data-table tr.is-archived { color: var(--muted); background: #fcfdfe; }
  .data-table tr.is-archived .table-primary { color: #4b5a57; }
  
  .empty-state { display: grid; min-height: 240px; place-items: center; align-content: center; gap: 8px; color: var(--muted); text-align: center; }
  .empty-state strong { color: var(--ink); font-size: 16px; font-weight: 700; }
  
  .reference-note {
    display: grid;
    gap: 16px;
    align-content: start;
    background: linear-gradient(180deg, #fff, var(--green-50));
  }
  .reference-note p { margin-bottom: 0; color: var(--muted); line-height: 1.6; }
  .info-list { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
  .info-list li {
    display: grid;
    gap: 4px;
    padding-top: 14px;
    border-top: 1px solid rgba(219, 227, 224, .9);
  }
  .info-list li:first-child { padding-top: 0; border-top: 0; }
  .info-list strong { font-size: 13px; font-weight: 700; }
  .info-list span { color: var(--muted); font-size: 12px; line-height: 1.5; }

  /* Admin Section */
  .admin-actions {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .admin-actions .button { width: 100%; }
  .admin-result {
    min-height: 280px;
    padding: 24px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: #fcfdfe;
  }
  .admin-output { margin: 0; overflow-x: auto; color: var(--ink); }
  .admin-output pre {
    margin: 12px 0 0;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    white-space: pre-wrap;
    background: #f1f5f4;
    padding: 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
  }
  .cleanup-item {
    display: flex;
    align-items: start;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: #fff;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .cleanup-item input { margin-top: 4px; accent-color: var(--green-900); }
  .cleanup-item strong, .cleanup-item span { display: block; }
  .cleanup-item span { margin-top: 3px; color: var(--muted); font-size: 11px; }

  /* Forms & Layout */
  .form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; align-items: start; gap: 24px; }
  .form-main { display: grid; gap: 20px; }
  .form-card { padding: 30px; }
  .step-heading { display: flex; gap: 16px; margin-bottom: 28px; }
  .step-heading > span { display: grid; width: 38px; height: 38px; flex: 0 0 38px; place-items: center; border-radius: 11px; color: #fff; background: var(--green-900); font-size: 12px; font-weight: 800; }
  .step-heading h3 { margin-bottom: 4px; font-size: 18px; }
  .step-heading p { margin-bottom: 0; color: var(--muted); font-size: 12px; }
  
  .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .field { display: grid; align-content: start; gap: 8px; margin-bottom: 18px; color: var(--ink); font-size: 12px; font-weight: 700; }
  .field-wide { grid-column: 1 / -1; }
  .field input:not([type="checkbox"]):not([type="radio"]), .field select, .field textarea {
    width: 100%;
    min-height: 44px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    outline: none;
    color: var(--ink);
    background: #fafcfb;
    font-weight: 500;
    transition: all .15s ease-out;
  }
  .field textarea { resize: vertical; }
  .field input:not([type="checkbox"]):not([type="radio"]):focus, .field select:focus, .field textarea:focus { border-color: var(--green-800); box-shadow: var(--ring); background: #fff; }
  
  .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .choice-card {
    position: relative;
    display: grid;
    gap: 6px;
    min-height: 96px;
    padding: 16px 16px 16px 48px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: #fff;
    cursor: pointer;
    transition: all .2s var(--ease-out);
  }

  .detail-grid div strong { margin-top: 4px; font-size: 13px; color: var(--ink); }

  .email-envelope { display: grid; gap: 10px; margin-bottom: 20px; padding: 18px; border-radius: var(--radius-md); background: var(--green-50); border: 1px solid var(--green-100); }

  .email-preview-frame { width: 100%; min-height: 360px; border: 1px solid var(--line); border-radius: var(--radius-md); background: #fff; }

  /* Toast Notification */
  .toast-region { position: fixed; z-index: 100; right: 24px; bottom: 24px; display: grid; gap: 10px; width: min(400px, calc(100% - 48px)); }
  .toast { 
    padding: 16px 20px; 
    border-radius: var(--radius-md); 
    color: #fff; 
    background: var(--green-950); 
    box-shadow: var(--shadow-lg); 
    animation: toast-in .35s var(--ease-out) both; 
    white-space: pre-line; 
    font-weight: 600;
    font-size: 13px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .toast.is-error { background: var(--danger); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  
  /* Boot Loader */
  .boot-loader { position: fixed; z-index: 200; inset: 0; display: grid; place-items: center; align-content: center; gap: 16px; color: var(--green-950); background: var(--canvas); transition: opacity .35s ease; }

  .boot-loader strong { font-size: 16px; font-weight: 700; }
  
  .loader-spinner {
    position: relative;
    width: 54px;
    height: 54px;
    border: 4px solid var(--green-100);
    border-top-color: var(--green-900);
    border-radius: 50%;
    animation: loader-spin .85s linear infinite;
  }
  .loader-spinner::before {
    position: absolute;
    inset: 6px;
    border: 3px solid transparent;
    border-right-color: var(--yellow);
    border-radius: 50%;
    animation: loader-spin .6s linear infinite reverse;
    content: "";
  }
  .loader-spinner span {
    position: absolute;
    inset: 50% auto auto 50%;
    width: 8px;
    height: 8px;
    border-radius: 50%;

  .boot-progress {
    overflow: hidden;
    width: min(340px, calc(100vw - 48px));

    border: 1px solid rgba(1, 88, 80, .15);

  /* Skeleton Loading */

  @keyframes skeleton { to { background-position: -200% 0; } }
  
  .mobile-nav { display: none; }

  /* Tailwind-inspired animations & transitions */
  .transition-all {
    transition-property: all;
    transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    transition-duration: 200ms;
  }
  .duration-200 { transition-duration: 200ms; }
  .duration-300 { transition-duration: 300ms; }
  .ease-in-out { transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
  
  .animate-pulse {
    animation: tw-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  }
  @keyframes tw-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .5; }
  }
  
  .animate-bounce {
    animation: tw-bounce 1s infinite;
  }
  @keyframes tw-bounce {
    0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); }
    50% { transform: none; animation-timing-function: cubic-bezier(0,0,0.2,1); }
  }
  
  .hover\:-translate-y-0.5:hover { transform: translateY(-2px); }
  .hover\:-translate-y-1:hover { transform: translateY(-4px); }
  .hover\:-translate-y-2:hover { transform: translateY(-8px); }
