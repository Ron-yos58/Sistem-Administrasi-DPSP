<style>
  :root {
    --green-950: #003d38;
    --green-900: #015850;
    --green-800: #087168;
    --green-100: #dcece9;
    --green-50: #f0f7f5;
    --yellow: #ffeb2f;
    --ink: #172321;
    --muted: #65726f;
    --line: #dbe3e0;
    --paper: #ffffff;
    --canvas: #f4f7f6;
    --danger: #b42318;
    --danger-soft: #fef3f2;
    --warning: #9a6700;
    --warning-soft: #fff9e6;
    --success: #067647;
    --shadow: 0 18px 48px rgba(0, 56, 51, .09);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 10px;
    --sidebar-width: 244px;
  }

  * { box-sizing: border-box; }
  html { background: var(--canvas); }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 85% 0%, rgba(1, 88, 80, .08), transparent 25rem),
      var(--canvas);
    font-family: "Manrope", sans-serif;
    font-size: 14px;
  }
  button, input, select, textarea { font: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  h1, h2, h3, p { margin-top: 0; }
  h1, h2, h3 { color: var(--ink); }
  h1 { margin-bottom: 0; font-size: 28px; letter-spacing: -.04em; }
  h2 { margin-bottom: 10px; font-family: "Newsreader", serif; font-size: 34px; line-height: 1.08; }
  h3 { margin-bottom: 8px; font-size: 18px; letter-spacing: -.02em; }
  .is-hidden { display: none !important; }
  .app-shell { min-height: 100vh; }

  .sidebar {
    position: fixed;
    z-index: 20;
    inset: 0 auto 0 0;
    display: flex;
    width: var(--sidebar-width);
    flex-direction: column;
    padding: 22px 16px;
    color: #fff;
    background:
      linear-gradient(165deg, rgba(255,255,255,.06), transparent 38%),
      var(--green-950);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 8px 26px;
  }
  .brand-mark, .loader-mark {
    display: grid;
    width: 44px;
    height: 44px;
    place-items: center;
    border-radius: 13px;
    color: var(--green-950);
    background: var(--yellow);
    font-family: "Newsreader", serif;
    font-size: 25px;
    font-weight: 700;
    box-shadow: 0 8px 22px rgba(255, 235, 47, .18);
  }
  .brand strong { display: block; font-size: 17px; }
  .brand span { display: block; margin-top: 2px; color: rgba(255,255,255,.62); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .main-nav { display: grid; gap: 6px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 46px;
    padding: 0 12px;
    border: 0;
    border-radius: 12px;
    color: rgba(255,255,255,.7);
    background: transparent;
    text-align: left;
    font-weight: 600;
    transition: .2s ease;
  }
  .nav-item:hover { color: #fff; background: rgba(255,255,255,.07); }
  .nav-item.is-active { color: var(--green-950); background: var(--yellow); }
  .nav-icon { display: grid; width: 25px; height: 25px; place-items: center; font-weight: 800; }
  .sidebar-foot { margin-top: auto; }
  .user-chip {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 10px;
    border-top: 1px solid rgba(255,255,255,.12);
  }
  .avatar {
    display: grid;
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    place-items: center;
    border-radius: 50%;
    color: var(--green-950);
    background: #fff;
    font-weight: 800;
  }
  .user-chip strong, .user-chip span { display: block; overflow: hidden; max-width: 155px; text-overflow: ellipsis; white-space: nowrap; }
  .user-chip strong { font-size: 11px; }
  .user-chip div > span { margin-top: 3px; color: rgba(255,255,255,.55); font-size: 10px; text-transform: uppercase; }
  .version { padding: 0 10px; color: rgba(255,255,255,.38); font-size: 10px; }

  .workspace { min-height: 100vh; margin-left: var(--sidebar-width); }
  .topbar {
    display: flex;
    min-height: 98px;
    align-items: center;
    gap: 18px;
    padding: 18px clamp(20px, 4vw, 54px);
    border-bottom: 1px solid rgba(219, 227, 224, .8);
    background: rgba(244, 247, 246, .82);
    backdrop-filter: blur(16px);
  }
  .topbar-actions { display: flex; gap: 10px; margin-left: auto; }
  .menu-toggle { display: none !important; }
  .eyebrow { margin-bottom: 5px; color: var(--green-800); font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
  .main-content { width: min(1500px, 100%); margin: 0 auto; padding: 30px clamp(20px, 4vw, 54px) 60px; }
  .view { display: none; animation: reveal .25s ease both; }
  .view.is-active { display: block; }
  @keyframes reveal { from { opacity: 0; transform: translateY(6px); } }

  .button {
    display: inline-flex;
    min-height: 42px;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 0 17px;
    border: 1px solid transparent;
    border-radius: 11px;
    font-weight: 700;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .button:hover { transform: translateY(-1px); }
  .button:disabled { cursor: wait; opacity: .58; transform: none; }
  .button-primary { color: #fff; background: var(--green-900); box-shadow: 0 8px 18px rgba(1,88,80,.15); }
  .button-primary:hover { background: var(--green-800); }
  .button-secondary { border-color: var(--line); color: var(--ink); background: var(--paper); }
  .button-accent { color: var(--green-950); background: var(--yellow); }
  .button-danger { color: var(--danger); background: var(--danger-soft); }
  .button-small { min-height: 34px; padding: 0 11px; font-size: 12px; }
  .button-full { width: 100%; }
  .text-button { padding: 0; border: 0; color: var(--green-800); background: transparent; font-weight: 800; }
  .icon-button {
    display: grid;
    width: 42px;
    height: 42px;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 11px;
    color: var(--ink);
    background: var(--paper);
    font-size: 20px;
  }

  .notice { margin-bottom: 20px; padding: 14px 16px; border-radius: 12px; white-space: pre-line; }
  .notice-error { border: 1px solid #fecdca; color: var(--danger); background: var(--danger-soft); }
  .hero-panel {
    position: relative;
    display: flex;
    min-height: 230px;
    align-items: end;
    justify-content: space-between;
    gap: 30px;
    overflow: hidden;
    padding: clamp(28px, 5vw, 54px);
    border-radius: var(--radius-lg);
    color: #fff;
    background:
      linear-gradient(120deg, rgba(0,61,56,.97), rgba(1,88,80,.88)),
      repeating-linear-gradient(135deg, transparent 0 22px, rgba(255,255,255,.06) 23px 24px);
    box-shadow: var(--shadow);
  }
  .hero-panel::after {
    position: absolute;
    width: 280px;
    height: 280px;
    right: -70px;
    top: -110px;
    border: 55px solid rgba(255,235,47,.15);
    border-radius: 50%;
    content: "";
  }
  .hero-panel > * { position: relative; z-index: 1; }
  .hero-panel h2 { max-width: 650px; margin-bottom: 12px; color: #fff; font-size: clamp(34px, 5vw, 57px); }
  .hero-panel p:not(.eyebrow) { max-width: 600px; margin-bottom: 0; color: rgba(255,255,255,.7); line-height: 1.7; }
  .hero-panel .eyebrow { color: var(--yellow); }

  .metric-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin: 22px 0;
  }
  .metric-card {
    position: relative;
    overflow: hidden;
    min-height: 138px;
    padding: 22px;
    border: 1px solid rgba(219,227,224,.9);
    border-radius: var(--radius-md);
    background: var(--paper);
  }
  .metric-card::after { position: absolute; right: -25px; bottom: -40px; width: 100px; height: 100px; border-radius: 50%; background: var(--green-50); content: ""; }
  .metric-card strong { display: block; margin: 8px 0 3px; font-family: "Newsreader", serif; font-size: 38px; line-height: 1; }
  .metric-card span { color: var(--muted); font-size: 12px; }
  .metric-card .metric-label { color: var(--green-800); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }

  .content-grid { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(290px, .8fr); gap: 20px; }
  .panel, .form-card, .review-card {
    border: 1px solid rgba(219,227,224,.9);
    border-radius: var(--radius-md);
    background: var(--paper);
    box-shadow: 0 4px 16px rgba(0, 56, 51, .025);
  }
  .panel { padding: 24px; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
  .request-list { display: grid; }
  .request-row {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(120px, .7fr) auto;
    align-items: center;
    gap: 18px;
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }
  .request-row:first-child { border-top: 0; }
  .request-row strong, .request-row span { display: block; }
  .request-row small { display: block; margin-top: 4px; color: var(--muted); }
  .focus-panel { background: linear-gradient(180deg, #fff, var(--green-50)); }
  .workflow-list { display: grid; gap: 17px; margin: 24px 0 0; padding: 0; list-style: none; }
  .workflow-list li { display: flex; align-items: center; gap: 12px; }
  .workflow-list li > span { display: grid; width: 34px; height: 34px; flex: 0 0 34px; place-items: center; border-radius: 10px; color: #fff; background: var(--green-900); font-weight: 800; }
  .workflow-list strong, .workflow-list small { display: block; }
  .workflow-list small { margin-top: 2px; color: var(--muted); }

  .section-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .section-toolbar > .button { margin-left: auto; }
  .search-box { display: flex; width: min(460px, 100%); min-height: 44px; align-items: center; gap: 9px; padding: 0 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
  .search-box input { width: 100%; border: 0; outline: 0; background: transparent; }
  .section-toolbar select { min-height: 44px; padding: 0 36px 0 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
  .table-panel { padding: 0; overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  .data-table { width: 100%; border-collapse: collapse; text-align: left; }
  .data-table th { padding: 13px 16px; color: var(--muted); background: var(--green-50); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .data-table td { padding: 15px 16px; border-top: 1px solid var(--line); vertical-align: top; }
  .data-table tbody tr:hover { background: #fbfdfc; }
  .table-primary { display: block; max-width: 360px; font-weight: 700; }
  .table-secondary { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
  .status {
    display: inline-flex;
    min-height: 25px;
    align-items: center;
    gap: 6px;
    padding: 0 9px;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .status::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
  .status-ready, .status-generated, .status-drafted { color: var(--success); background: #ecfdf3; }
  .status-draft, .status-pending { color: var(--warning); background: var(--warning-soft); }
  .status-error { color: var(--danger); background: var(--danger-soft); }
  .empty-state { display: grid; min-height: 230px; place-items: center; align-content: center; gap: 6px; color: var(--muted); text-align: center; }
  .empty-state strong { color: var(--ink); font-size: 17px; }

  .form-layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; align-items: start; gap: 20px; }
  .form-main { display: grid; gap: 16px; }
  .form-card { padding: 26px; }
  .step-heading { display: flex; gap: 14px; margin-bottom: 24px; }
  .step-heading > span { display: grid; width: 36px; height: 36px; flex: 0 0 36px; place-items: center; border-radius: 10px; color: #fff; background: var(--green-900); font-size: 11px; font-weight: 800; }
  .step-heading h3 { margin-bottom: 3px; }
  .step-heading p { margin-bottom: 0; color: var(--muted); font-size: 12px; }
  .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 17px; }
  .field { display: grid; align-content: start; gap: 7px; margin-bottom: 17px; color: var(--ink); font-size: 12px; font-weight: 700; }
  .field-wide { grid-column: 1 / -1; }
  .field input:not([type="checkbox"]):not([type="radio"]), .field select, .field textarea {
    width: 100%;
    min-height: 45px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    color: var(--ink);
    background: #fbfcfc;
    font-weight: 500;
    transition: border .15s, box-shadow .15s;
  }
  .field textarea { resize: vertical; }
  .field input:not([type="checkbox"]):not([type="radio"]):focus, .field select:focus, .field textarea:focus { border-color: var(--green-800); box-shadow: 0 0 0 3px rgba(1,88,80,.1); background: #fff; }
  .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .choice-card {
    position: relative;
    display: grid;
    gap: 6px;
    min-height: 92px;
    padding: 14px 14px 14px 48px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #fff;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .choice-card input[type="checkbox"] {
    position: absolute;
    top: 16px;
    left: 14px;
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--green-900);
  }
  .choice-card:hover { border-color: #b5ccc7; }
  .choice-card:has(input:checked) { border-color: var(--green-800); background: var(--green-50); box-shadow: inset 0 0 0 1px var(--green-800); }
  .choice-card strong { font-size: 12px; }
  .choice-card small { color: var(--muted); font-weight: 500; line-height: 1.4; }
  .document-number { display: block; margin-top: 6px; }
  .document-number input {
    position: static;
    width: 100%;
    min-height: 34px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #fbfcfc;
    font-size: 11px;
    font-weight: 500;
  }
  .document-number input:focus {
    border-color: var(--green-800);
    box-shadow: 0 0 0 2px rgba(1,88,80,.1);
    outline: none;
    background: #fff;
  }
  .conditional-block { padding: 18px; border: 1px dashed #b5ccc7; border-radius: 13px; background: var(--green-50); }
  .block-label { margin-bottom: 14px; color: var(--green-800); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
  .segmented { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .segmented label { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .segmented input, .check-list input { margin-right: 7px; accent-color: var(--green-900); }
  .check-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; }
  .check-list label { padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 11px; }
  .employee-list { display: grid; gap: 12px; margin-bottom: 14px; }
  .employee-card { position: relative; padding: 18px; border: 1px solid var(--line); border-radius: 13px; background: #fbfcfc; }
  .employee-card .field-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .employee-card .field { margin-bottom: 0; }
  .remove-employee { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 8px; color: var(--danger); background: var(--danger-soft); }
  .helper-text { margin-bottom: 0; color: var(--muted); font-size: 11px; }
  .form-review { position: sticky; top: 20px; }
  .review-card { overflow: hidden; padding: 22px; }
  .review-card::before { display: block; width: 80px; height: 5px; margin: -22px 0 20px -22px; background: var(--yellow); content: ""; }
  .review-content { display: grid; gap: 15px; margin-top: 18px; }
  .review-line { padding-top: 12px; border-top: 1px solid var(--line); }
  .review-line span, .review-line strong { display: block; }
  .review-line span { color: var(--muted); font-size: 10px; text-transform: uppercase; }
  .review-line strong { margin-top: 4px; font-size: 12px; line-height: 1.5; }
  .form-actions {
    position: sticky;
    z-index: 8;
    bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: rgba(255,255,255,.92);
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px);
  }
  .form-actions > div { display: flex; gap: 9px; }

  .detail-drawer {
    position: fixed;
    z-index: 51;
    inset: 0 0 0 auto;
    width: min(650px, 100%);
    padding: 25px;
    overflow-y: auto;
    background: var(--paper);
    box-shadow: -20px 0 60px rgba(0, 46, 42, .18);
    transform: translateX(105%);
    transition: transform .25s ease;
  }
  .detail-drawer.is-open { transform: translateX(0); }
  .drawer-backdrop { position: fixed; z-index: 50; inset: 0; background: rgba(0, 25, 23, .38); backdrop-filter: blur(3px); }
  .drawer-head, .modal-head { display: flex; align-items: start; justify-content: space-between; gap: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
  .drawer-body { display: grid; gap: 18px; padding: 22px 0; }
  .detail-hero { padding: 22px; border-radius: 15px; color: #fff; background: var(--green-950); }
  .detail-hero h3 { color: #fff; font-family: "Newsreader", serif; font-size: 28px; }
  .detail-hero p { margin-bottom: 0; color: rgba(255,255,255,.65); }
  .detail-section { padding: 20px; border: 1px solid var(--line); border-radius: 14px; }
  .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .detail-grid div span, .detail-grid div strong { display: block; }
  .detail-grid div span { color: var(--muted); font-size: 10px; text-transform: uppercase; }
  .detail-grid div strong { margin-top: 4px; font-size: 12px; }
  .document-list { display: grid; gap: 10px; }
  .document-item { padding: 15px; border: 1px solid var(--line); border-radius: 12px; }
  .document-item-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
  .document-item strong { display: block; font-size: 12px; }
  .document-item small { display: block; margin-top: 4px; color: var(--muted); }
  .document-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }

  .modal {
    width: min(760px, calc(100% - 28px));
    max-height: calc(100vh - 40px);
    padding: 24px;
    border: 0;
    border-radius: 20px;
    box-shadow: 0 26px 80px rgba(0, 46, 42, .3);
  }
  .modal::backdrop { background: rgba(0,25,23,.48); backdrop-filter: blur(4px); }
  .modal-body { max-height: 65vh; overflow-y: auto; padding: 20px 0; }
  .modal-actions { display: flex; justify-content: end; gap: 9px; padding-top: 16px; border-top: 1px solid var(--line); }
  .email-envelope { display: grid; gap: 10px; margin-bottom: 18px; padding: 16px; border-radius: 13px; background: var(--green-50); }
  .email-envelope div span { display: inline-block; width: 70px; color: var(--muted); font-size: 10px; text-transform: uppercase; }
  .email-preview { padding: 18px; border: 1px solid var(--line); border-radius: 12px; line-height: 1.65; }
  .cost-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .system-checks { display: grid; gap: 8px; margin: 18px 0; }
  .system-check { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: 11px; }

  .toast-region { position: fixed; z-index: 100; right: 20px; bottom: 20px; display: grid; gap: 9px; width: min(390px, calc(100% - 40px)); }
  .toast { padding: 14px 16px; border-radius: 12px; color: #fff; background: var(--green-950); box-shadow: var(--shadow); animation: toast-in .2s ease both; white-space: pre-line; }
  .toast.is-error { background: var(--danger); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
  .boot-loader { position: fixed; z-index: 200; inset: 0; display: grid; place-items: center; align-content: center; gap: 14px; color: var(--green-950); background: var(--canvas); transition: opacity .25s ease; }
  .boot-loader.is-done { pointer-events: none; opacity: 0; }
  .skeleton { background: linear-gradient(90deg, #eef2f1 25%, #f8faf9 50%, #eef2f1 75%); background-size: 200% 100%; animation: skeleton 1.2s infinite; }
  @keyframes skeleton { to { background-position: -200% 0; } }
  .mobile-nav { display: none; }

  @media (max-width: 1080px) {
    :root { --sidebar-width: 208px; }
    .metric-grid { grid-template-columns: repeat(2, 1fr); }
    .form-layout { grid-template-columns: 1fr; }
    .form-review { position: static; }
    .review-content { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 860px) {
    body { padding-bottom: 74px; }
    .sidebar { transform: translateX(-105%); transition: transform .2s ease; }
    .sidebar.is-open { transform: translateX(0); }
    .workspace { margin-left: 0; }
    .topbar { min-height: 82px; padding: 14px 18px; }
    .menu-toggle { display: grid !important; }
    .topbar-actions .button-secondary { display: none; }
    .topbar-actions [data-view-target="form"] { display: none; }
    h1 { font-size: 23px; }
    .main-content { padding: 20px 16px 30px; }
