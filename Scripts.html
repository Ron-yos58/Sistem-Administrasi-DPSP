<script>
  const App = {
    state: {
      bootstrap: null,
      requests: [],
      travel: [],
      travelLoaded: false,
      signers: [],
      employeeCatalog: [],
      currentDetail: null,
      currentTravel: null,
      requestFilterTimer: null,
      activeView: 'dashboard'
    },

    async init() {
      this.setBootProgress(4, 'Menyiapkan tampilan...');
      this.refreshIcons();
      this.bindEvents();
      this.resetForm();
      try {
        this.setBootProgress(18, 'Memuat data utama...');
        const data = await this.server('getBootstrapData');
        this.setBootProgress(55, 'Merender dashboard...');
        this.state.bootstrap = data;
        this.state.requests = data.requests || [];
        this.hydrateUser(data);
        this.populateOptions(data.options);
        this.renderDashboard(data.summary, this.state.requests);
        this.renderRequests(this.state.requests);
        this.renderReferences(data.references);
        this.updateFormVisibility();
        this.setBootProgress(72, 'Sinkronisasi data biaya...');
        await this.preloadTravelData();
        this.setBootProgress(100, 'Siap digunakan');
      } catch (error) {
        this.showGlobalError(error);
      } finally {
        setTimeout(() => document.getElementById('bootLoader').classList.add('is-done'), 250);
      }
    },

    server(method, ...args) {
      return new Promise((resolve, reject) => {
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))));
        runner[method](...args);
      });
    },

    refreshIcons() {
      if (!window.lucide || typeof window.lucide.createIcons !== 'function') return;
      window.lucide.createIcons({
        attrs: {
          'aria-hidden': 'true',
          'stroke-width': 2
        }
      });
    },

    bindEvents() {
      document.querySelectorAll('[data-view], [data-view-target]').forEach(button => {
        button.addEventListener('click', () => this.switchView(button.dataset.view || button.dataset.viewTarget));
      });
      document.getElementById('menuToggle').addEventListener('click', () => this.toggleSidebar());
      document.getElementById('sidebarClose').addEventListener('click', () => this.setSidebarOpen(false, true));
      document.getElementById('sidebarBackdrop').addEventListener('click', () => this.setSidebarOpen(false, true));
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          this.setSidebarOpen(false, true);
          this.closeDrawer();
        }
      });
      document.addEventListener('click', event => {
        const sidebar = document.getElementById('sidebar');
        const toggle = document.getElementById('menuToggle');
        if (!sidebar.classList.contains('is-open')) return;
        if (sidebar.contains(event.target) || toggle.contains(event.target)) return;
        this.setSidebarOpen(false);
      });
      document.getElementById('refreshButton').addEventListener('click', () => this.refreshAll());
      document.getElementById('activityType').addEventListener('change', () => this.updateFormVisibility());
      document.getElementById('speakerSubtype').addEventListener('change', () => this.updateFormVisibility());
      document.getElementById('documentChoices').addEventListener('change', () => {
        this.updateFormVisibility(false);
        this.updateReview();
      });
      document.getElementById('speakerStatusChoices').addEventListener('change', () => this.updateReview());
      document.getElementById('facultyChoices').addEventListener('change', () => this.updateReview());
      document.getElementById('requestForm').addEventListener('input', () => this.updateReview());
      document.getElementById('requestForm').addEventListener('submit', event => this.saveRequest(event));
      document.getElementById('addSchedule').addEventListener('click', () => this.addSchedule());
      document.getElementById('scheduleList').addEventListener('click', event => {
        const button = event.target.closest('.remove-schedule');
        if (!button) return;
        const cards = document.querySelectorAll('.schedule-card');
        if (cards.length <= 1) {
          this.toast('Minimal satu sesi jadwal harus tersedia.', true);
          return;
        }
        button.closest('.schedule-card').remove();
        this.renumberSchedules_();
        this.updateReview();
      });
      document.getElementById('addEmployee').addEventListener('click', () => this.addEmployee());
      document.getElementById('employeeList').addEventListener('click', event => {
        const button = event.target.closest('.remove-employee');
        if (button) {
          button.closest('.employee-card').remove();
          this.updateReview();
        }
      });
      document.getElementById('employeeList').addEventListener('change', event => {
        const picker = event.target.closest('[data-employee-picker]');
        if (picker) this.applyEmployeeCatalogToCard_(picker.closest('.employee-card'), picker.value);
      });
      document.getElementById('resetForm').addEventListener('click', () => this.resetForm());
      document.getElementById('requestSearch').addEventListener('input', () => this.scheduleRequestFilter());
      document.getElementById('requestSearch').addEventListener('search', () => this.scheduleRequestFilter(0));
      document.getElementById('requestTypeFilter').addEventListener('change', () => this.scheduleRequestFilter(0));
      document.getElementById('requestStatusFilter').addEventListener('change', () => this.scheduleRequestFilter(0));
      document.getElementById('requestTableBody').addEventListener('click', event => {
        const button = event.target.closest('[data-request-id]');
        if (button) this.openRequestDetail(button.dataset.requestId);
      });
      document.getElementById('recentRequests').addEventListener('click', event => {
        const button = event.target.closest('[data-request-id]');
        if (button) this.openRequestDetail(button.dataset.requestId);
      });
      document.getElementById('closeDrawer').addEventListener('click', () => this.closeDrawer());
      document.getElementById('drawerBackdrop').addEventListener('click', () => this.closeDrawer());
      document.getElementById('drawerBody').addEventListener('click', event => this.handleDetailAction(event));
      document.getElementById('travelTableBody').addEventListener('click', event => {
        const button = event.target.closest('[data-travel-key]');
        if (button) this.openTravelModal(button.dataset.travelKey);
      });
      document.getElementById('travelCostForm').addEventListener('submit', event => this.saveTravelCosts(event));
      document.querySelectorAll('[data-admin-action]').forEach(button => {
        button.addEventListener('click', event => this.handleAdminAction(event.currentTarget));
      });
      document.getElementById('signerName').addEventListener('change', () => this.applySignerConfigFromForm_('name'));
      document.getElementById('signerId').addEventListener('change', () => this.applySignerConfigFromForm_('nik'));
      document.querySelectorAll('[data-close-dialog]').forEach(button => {
        button.addEventListener('click', () => document.getElementById(button.dataset.closeDialog).close());
      });
    },

    hydrateUser(data) {
      const email = data.user.email || 'Pengguna';
      const role = data.user.role || 'OPERATOR';
      document.getElementById('userEmail').textContent = email;
      document.getElementById('appVersion').textContent = 'v' + data.app.version;
      document.body.classList.toggle('is-admin', role === 'ADMIN');
    },

    populateOptions(options) {
      const typeSelect = document.getElementById('activityType');
      typeSelect.innerHTML = '<option value="">Pilih tipe kegiatan</option>' +
        options.activityTypes.map(item => `<option value="${this.escape(item)}">${this.escape(item)}</option>`).join('');
      document.getElementById('requestTypeFilter').innerHTML =
        '<option value="">Semua tipe</option>' +
        options.activityTypes.map(item => `<option value="${this.escape(item)}">${this.escape(item)}</option>`).join('');
      document.getElementById('speakerSubtype').innerHTML =
        '<option value="">Pilih sub-tipe</option>' +
        options.speakerSubtypes.map(item => `<option value="${this.escape(item)}">${this.escape(item)}</option>`).join('');
      document.getElementById('speakerStatusChoices').innerHTML =
        options.speakerStatuses.map(item => `
          <label><input type="radio" name="speakerStatus" value="${this.escape(item)}"> ${this.escape(item)}</label>
        `).join('');
      document.getElementById('facultyChoices').innerHTML =
        options.faculties.map(item => `
          <label><input type="checkbox" name="faculty" value="${this.escape(item)}"> ${this.escape(item)}</label>
        `).join('');
      this.renderSignerOptions(options.signers || []);
      this.setEmployeeCatalog_(options.employeeCatalog || []);
      this.renderDocumentChoices([]);
    },

    renderSignerOptions(signers) {
      this.state.signers = (signers || []).filter(item => item && (item.name || item.role || item.nik));
      const select = document.getElementById('signerName');
      const currentValue = select.value;
      select.innerHTML = '<option value="">Pilih penandatangan</option>' + this.state.signers.map(item => {
        const label = [item.name, item.role, item.nik].filter(Boolean).join(' | ');
        return `<option value="${this.escape(item.name || '')}" title="${this.escape(label)}">${this.escape(label)}</option>`;
      }).join('');
      if (currentValue) {
        select.value = currentValue;
      }
    },

    applySignerConfigFromForm_(source) {
      const nameInput = document.getElementById('signerName');
      const nikInput = document.getElementById('signerId');
      const roleInput = document.getElementById('signerRole');
      const name = nameInput.value.trim().toLowerCase();
      const nik = nikInput.value.trim();
      if (!name && !nik) {
        roleInput.value = '';
        this.updateReview();
        return;
      }

      let match = null;
      if (source === 'name' && name) {
        match = this.state.signers.find(item => String(item.name || '').trim().toLowerCase() === name);
      } else if (source === 'nik' && nik) {
        match = this.state.signers.find(item => item.nik === nik);
      } else {
        match = this.state.signers.find(item =>
          (name && String(item.name || '').trim().toLowerCase() === name) ||
          (nik && item.nik === nik)
        );
      }
      if (!match) return;

      if (match.name) nameInput.value = match.name;
      if (match.nik) nikInput.value = match.nik;
      if (match.role) roleInput.value = match.role;
      this.updateReview();
    },

    switchView(view) {
      const titles = {
        dashboard: 'Ringkasan',
        requests: 'Permohonan',
        form: document.getElementById('requestId').value ? 'Edit Permohonan' : 'Buat Permohonan',
        finance: 'Data Keuangan',
        references: 'Data Referensi',
        admin: 'Maintenance Sistem'
      };
      if (!titles[view] || !document.getElementById('view-' + view)) return;
      if (view === 'admin' && !document.body.classList.contains('is-admin')) {
        this.toast('Menu Admin hanya tersedia untuk role Admin.', true);
        view = 'dashboard';
      }
      this.state.activeView = view;
      document.querySelectorAll('.view').forEach(item => item.classList.remove('is-active'));
      document.getElementById('view-' + view).classList.add('is-active');
      document.querySelectorAll('[data-view]').forEach(item => item.classList.toggle('is-active', item.dataset.view === view));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('is-active', item.dataset.view === view));
      document.getElementById('pageTitle').textContent = titles[view];
      this.setSidebarOpen(false);
      if (view === 'finance' && !this.state.travelLoaded) this.syncAndLoadTravel();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },

    toggleSidebar() {
      this.setSidebarOpen(!document.getElementById('sidebar').classList.contains('is-open'));
    },

    setSidebarOpen(open, restoreFocus) {
      const isOpen = Boolean(open);
      const sidebar = document.getElementById('sidebar');
      const toggle = document.getElementById('menuToggle');
      const focusWasInside = sidebar.contains(document.activeElement);
      sidebar.classList.toggle('is-open', isOpen);
      sidebar.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
      sidebar.inert = !isOpen;
      document.getElementById('sidebarBackdrop').classList.toggle('is-visible', isOpen);
      document.body.classList.toggle('sidebar-open', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      toggle.setAttribute('aria-label', isOpen ? 'Tutup menu' : 'Buka menu');
      if (isOpen) {
        document.getElementById('sidebarClose').focus();
      } else if (restoreFocus || focusWasInside) {
        toggle.focus();
      }
    },

    renderDashboard(summary, requests) {
      const metrics = [
        ['Permohonan aktif', summary.total, 'Belum ditandai selesai'],
        ['Draft', summary.drafts, 'Masih dapat diubah'],
        ['Siap diproses', summary.ready, 'Data sudah tervalidasi'],
        ['Perlu tindak lanjut', Number(summary.documentsPending || 0) + Number(summary.documentsFailed || 0) + Number(summary.emailsPending || 0), 'Dokumen atau email belum tuntas']
      ];
      document.getElementById('metricGrid').innerHTML = metrics.map(item => `
        <article class="metric-card">
          <span class="metric-label">${this.escape(item[0])}</span>
          <strong>${Number(item[1] || 0)}</strong>
          <span>${this.escape(item[2])}</span>
        </article>
      `).join('');
      document.getElementById('recentRequests').innerHTML = requests.slice(0, 6).map(item => `
        <div class="request-row">
          <div><strong>${this.escape(item.activityName || item.id)}</strong><small>${this.escape(item.id)} · ${this.escape(item.partnerName)}</small></div>
          <div><span>${this.escape(item.dateDisplay || '-')}</span><small>${this.escape(item.activityType)}</small></div>
          <div class="status-stack">${this.requestWorkflowBadges_(item)}</div>
          <button class="button button-secondary button-small" data-request-id="${this.escape(item.id)}">Detail</button>
        </div>
      `).join('') || '<div class="empty-state"><strong>Belum ada permohonan</strong><span>Mulai dari formulir baru.</span></div>';
    },

    renderRequests(items) {
      const body = document.getElementById('requestTableBody');
      body.innerHTML = items.map(item => `
        <tr class="${item.status === 'ARCHIVED' ? 'is-archived' : ''}">
          <td data-label="ID"><span class="table-primary">${this.escape(item.id)}</span><span class="table-secondary">${this.escape(item.updatedBy || item.createdBy || '-')}</span></td>
          <td data-label="Kegiatan"><span class="table-primary">${this.escape(item.activityName || '-')}</span><span class="table-secondary">${this.escape(item.activityType)}</span></td>
          <td data-label="Mitra">${this.escape(item.partnerName || '-')}</td>
          <td data-label="Tanggal">${this.escape(item.dateDisplay || '-')}</td>
          <td data-label="Dokumen"><span class="table-primary">${this.escape(this.asArray(item.documentTypes).join(', ') || '-')}</span></td>
          <td data-label="Status"><div class="status-stack">${this.requestWorkflowBadges_(item)}</div></td>
          <td data-label="Aksi"><button class="button button-secondary button-small" data-request-id="${this.escape(item.id)}">Detail</button></td>
        </tr>
      `).join('');
      document.getElementById('requestEmpty').classList.toggle('is-hidden', items.length > 0);
    },

    renderReferences(references) {
      const rows = (references && references.cc) || [];
      document.getElementById('referenceTableBody').innerHTML = rows.map(item => `
        <tr><td data-label="Unit">${this.escape(item.unit)}</td><td data-label="Jabatan">${this.escape(item.role)}</td><td data-label="Email">${this.escape(item.email)}</td></tr>
      `).join('');
    },

    async loadRequests() {
      const filters = {
        query: document.getElementById('requestSearch').value,
        activityType: document.getElementById('requestTypeFilter').value,
        status: document.getElementById('requestStatusFilter').value,
        includeArchived: document.getElementById('requestStatusFilter').value === 'ARCHIVED',
        limit: 250
      };
      try {
        const result = await this.server('listRequests', filters);
        this.state.requests = result.items;
        this.renderRequests(result.items);
      } catch (error) {
        this.toast(error.message, true);
      }
    },

    scheduleRequestFilter(delay = 350) {
      clearTimeout(this.state.requestFilterTimer);
      this.state.requestFilterTimer = setTimeout(() => this.loadRequests(), delay);
    },

    allowedDocuments() {
      const type = document.getElementById('activityType').value;
      const subtype = document.getElementById('speakerSubtype').value;
      const descriptions = {
        'Surat Tugas': 'Penugasan petugas atau narasumber',
        'Surat Balasan Campus Visit': 'Balasan resmi kepada mitra',
        'Surat Rekomendasi Campus Visit - SU': 'Rekomendasi kepada Sekretaris Universitas',
        'Surat izin pimpinan - Campus Visit': 'Permohonan izin kepada pimpinan',
        'Surat Permohonan Narasumber kepada Dekan': 'Permohonan penugasan atau pencarian dosen'
      };
      let types = [];
      if (type === 'Edu Fair') types = ['Surat Tugas'];
      if (type === 'Campus Visit') types = ['Surat Tugas', 'Surat Balasan Campus Visit', 'Surat Rekomendasi Campus Visit - SU', 'Surat izin pimpinan - Campus Visit'];
      if (type === 'Penugasan Narasumber') {
        types = subtype === 'Promosi' ? ['Surat Tugas'] : ['Surat Tugas', 'Surat Permohonan Narasumber kepada Dekan'];
      }
      return types.map(typeName => ({ type: typeName, description: descriptions[typeName] }));
    },

    renderDocumentChoices(selectedDocuments) {
      const selected = {};
      (selectedDocuments || this.collectDocuments()).forEach(item => selected[item.type] = item);
      const allowed = this.allowedDocuments();
      document.getElementById('documentChoices').innerHTML = allowed.map((item, index) => {
        const checked = selected[item.type] || (allowed.length === 1 && index === 0);
        const number = selected[item.type] ? selected[item.type].number : '';
        return `
          <label class="choice-card">
            <input type="checkbox" name="documentType" value="${this.escape(item.type)}" ${checked ? 'checked' : ''}>
            <strong>${this.escape(item.type)}</strong>
            <small>${this.escape(item.description)}</small>
            <span class="document-number"><input type="text" data-document-number="${this.escape(item.type)}" value="${this.escape(number)}" placeholder="Nomor surat"></span>
          </label>
        `;
      }).join('') || '<p class="helper-text">Pilih tipe kegiatan untuk menampilkan dokumen.</p>';
    },

    updateFormVisibility(rerenderDocuments = true) {
      const type = document.getElementById('activityType').value;
      const subtype = document.getElementById('speakerSubtype').value;
      const oldDocuments = this.collectDocuments();
      document.querySelectorAll('.speaker-only').forEach(item => item.classList.toggle('is-hidden', type !== 'Penugasan Narasumber'));
      if (rerenderDocuments) this.renderDocumentChoices(oldDocuments);
      const selectedTypes = this.collectDocuments().map(item => item.type);
      const hasSpeakerRequest = type === 'Penugasan Narasumber' &&
        subtype !== 'Promosi' &&
        selectedTypes.includes('Surat Permohonan Narasumber kepada Dekan');
      document.querySelectorAll('.speaker-request-only').forEach(item => item.classList.toggle('is-hidden', !hasSpeakerRequest));
      const needsIncoming = selectedTypes.some(item => item !== 'Surat Tugas');
      document.getElementById('incomingFields').classList.toggle('is-hidden', !needsIncoming);
      this.updateReview();
    },

    addSchedule(schedule = {}) {
      const index = document.querySelectorAll('.schedule-card').length + 1;
      const card = document.createElement('div');
      card.className = 'schedule-card';
      card.innerHTML = `
        <button type="button" class="remove-schedule" aria-label="Hapus sesi"><i data-lucide="x" aria-hidden="true"></i></button>
        <input type="hidden" data-schedule-field="id" value="${this.escape(schedule.id || '')}">
        <div class="field-grid">
          <label class="field"><span>Tanggal mulai *</span><input type="date" data-schedule-field="startDate" value="${this.escape(schedule.startDate || '')}" required></label>
          <label class="field"><span>Tanggal selesai</span><input type="date" data-schedule-field="endDate" value="${this.escape(schedule.endDate || schedule.startDate || '')}"></label>
          <div class="field"><span>Sesi</span><strong data-schedule-index>${index}</strong></div>
          <label class="field"><span>Waktu mulai</span><input type="time" data-schedule-field="startTime" value="${this.escape(schedule.startTime || '')}"></label>
          <label class="field"><span>Waktu selesai</span><input type="time" data-schedule-field="endTime" value="${this.escape(schedule.endTime || '')}"></label>
          <label class="field schedule-place"><span>Tempat *</span><input data-schedule-field="place" value="${this.escape(schedule.place || '')}" required></label>
        </div>
      `;
      document.getElementById('scheduleList').appendChild(card);
      this.renumberSchedules_();
      this.refreshIcons();
      this.updateReview();
    },

    renumberSchedules_() {
      document.querySelectorAll('.schedule-card').forEach((card, index) => {
        const label = card.querySelector('[data-schedule-index]');
        if (label) label.textContent = index + 1;
      });
    },

    scheduleFromCard_(card) {
      const schedule = {};
      card.querySelectorAll('[data-schedule-field]').forEach(input => {
        schedule[input.dataset.scheduleField] = input.value.trim();
      });
      return schedule;
    },

    collectSchedules() {
      return Array.from(document.querySelectorAll('.schedule-card'))
        .map(card => this.scheduleFromCard_(card))
        .filter(schedule => schedule.startDate || schedule.startTime || schedule.endTime || schedule.place);
    },

    scheduleLabel_(schedule) {
      const date = schedule.startDate || 'Tanggal belum diisi';
      const endDate = schedule.endDate && schedule.endDate !== schedule.startDate
        ? ' s.d. ' + schedule.endDate
        : '';
      const time = [schedule.startTime, schedule.endTime].filter(Boolean).join(' - ');
      return date + endDate + (time ? ', ' + time : '') + (schedule.place ? ', ' + schedule.place : '');
    },

    addEmployee(employee = {}) {
      const index = document.querySelectorAll('.employee-card').length + 1;
      const catalogCount = this.state.employeeCatalog.length;
      const pickerOptions = this.state.employeeCatalog.map((item, itemIndex) => {
        const label = [item.name, item.identifier, item.unit].filter(Boolean).join(' | ');
        const selected = this.employeeCatalogMatches_(item, employee) ? 'selected' : '';
        return `<option value="${itemIndex}" ${selected}>${this.escape(label)}</option>`;
      }).join('');
      const card = document.createElement('div');
      card.className = 'employee-card';
      card.innerHTML = `
        <button type="button" class="remove-employee" aria-label="Hapus orang">×</button>
        <input type="hidden" data-employee-field="participantKey" value="${this.escape(employee.participantKey || '')}">
        <label class="field field-wide">
          <span>Pilih dari database pegawai</span>
          <select data-employee-picker>
            <option value="">${catalogCount ? 'Isi manual / pilih orang lama' : 'Database pegawai kosong - isi manual'}</option>
            ${pickerOptions}
          </select>
          <small class="catalog-status ${catalogCount ? '' : 'is-empty'}">${catalogCount} data pegawai tersedia</small>
        </label>
        <div class="field-grid">
          <label class="field"><span>Nama *</span><input data-employee-field="name" value="${this.escape(employee.name || '')}" placeholder="Orang ${index}"></label>
          <label class="field"><span>NIP/NPM</span><input data-employee-field="identifier" value="${this.escape(employee.identifier || '')}"></label>
          <label class="field"><span>Email</span><input type="email" data-employee-field="email" value="${this.escape(employee.email || '')}"></label>
          <label class="field"><span>Jabatan</span><input data-employee-field="role" value="${this.escape(employee.role || '')}"></label>
          <label class="field"><span>Prodi / Unit</span><input data-employee-field="unit" value="${this.escape(employee.unit || '')}"></label>
          <label class="field"><span>Pangkat penunjang</span><input data-employee-field="rank" value="${this.escape(employee.rank || '')}"></label>
          <label class="field"><span>Kategori penerima tugas</span><input data-employee-field="category" value="${this.escape(employee.category || '')}"></label>
        </div>
      `;
      document.getElementById('employeeList').appendChild(card);
      this.updateReview();
    },

    setEmployeeCatalog_(catalog) {
      const cards = Array.from(document.querySelectorAll('.employee-card'));
      const currentEmployees = cards.map(card => this.employeeFromCard_(card));
      this.state.employeeCatalog = Array.isArray(catalog) ? catalog : [];
      if (!cards.length) return;

      document.getElementById('employeeList').innerHTML = '';
      currentEmployees.forEach(employee => this.addEmployee(employee));
    },

    employeeFromCard_(card) {
      const employee = {};
      card.querySelectorAll('[data-employee-field]').forEach(input => {
        employee[input.dataset.employeeField] = input.value.trim();
      });
      return employee;
    },

    employeeCatalogMatches_(catalogItem, employee) {
      if (!employee) return false;
      const catalogIdentifier = String(catalogItem.identifier || '').trim().toLowerCase();
      const employeeIdentifier = String(employee.identifier || '').trim().toLowerCase();
      const catalogEmail = String(catalogItem.email || '').trim().toLowerCase();
      const employeeEmail = String(employee.email || '').trim().toLowerCase();
      const catalogName = String(catalogItem.name || '').trim().toLowerCase();
      const employeeName = String(employee.name || '').trim().toLowerCase();
      return Boolean(
        (catalogIdentifier && catalogIdentifier === employeeIdentifier) ||
        (catalogEmail && catalogEmail === employeeEmail) ||
        (catalogName && catalogName === employeeName)
      );
    },

    applyEmployeeCatalogToCard_(card, selectedIndex) {
      if (!card) return;
      const item = this.state.employeeCatalog[Number(selectedIndex)];
      if (!item) return;
      card.querySelector('[data-employee-field="name"]').value = item.name || '';
      card.querySelector('[data-employee-field="identifier"]').value = item.identifier || '';
      card.querySelector('[data-employee-field="email"]').value = item.email || '';
      card.querySelector('[data-employee-field="role"]').value = item.role || '';
      card.querySelector('[data-employee-field="unit"]').value = item.unit || '';
      card.querySelector('[data-employee-field="rank"]').value = item.rank || '';
      card.querySelector('[data-employee-field="category"]').value = item.category || '';
      this.updateReview();
    },

    collectEmployees() {
      return Array.from(document.querySelectorAll('.employee-card'))
        .map(card => this.employeeFromCard_(card))
        .filter(item => item.name || item.identifier || item.email);
    },

    collectDocuments() {
      return Array.from(document.querySelectorAll('input[name="documentType"]:checked')).map(input => ({
        type: input.value,
        number: document.querySelector(`[data-document-number="${CSS.escape(input.value)}"]`)?.value.trim() || ''
      }));
    },

    collectForm(status) {
      const checked = selector => Array.from(document.querySelectorAll(selector + ':checked')).map(input => input.value);
      const documents = this.collectDocuments();
      const hasSpeakerRequest = document.getElementById('activityType').value === 'Penugasan Narasumber' &&
        documents.some(document => document.type === 'Surat Permohonan Narasumber kepada Dekan');
      const needsIncoming = documents.some(document => document.type !== 'Surat Tugas');
      const schedules = this.collectSchedules();
      return {
        id: document.getElementById('requestId').value,
        revision: document.getElementById('requestRevision').value,
        clientToken: document.getElementById('clientToken').value,
        status,
        activityType: document.getElementById('activityType').value,
        speakerSubtype: document.getElementById('activityType').value === 'Penugasan Narasumber'
          ? document.getElementById('speakerSubtype').value
          : '',
        speakerStatus: hasSpeakerRequest
          ? (document.querySelector('input[name="speakerStatus"]:checked')?.value || '')
          : '',
        faculties: hasSpeakerRequest ? checked('input[name="faculty"]') : [],
        documents,
        incomingNumber: needsIncoming ? document.getElementById('incomingNumber').value : '',
        incomingDate: needsIncoming ? document.getElementById('incomingDate').value : '',
        incomingSender: needsIncoming ? document.getElementById('incomingSender').value : '',
        incomingSubject: needsIncoming ? document.getElementById('incomingSubject').value : '',
        activityName: document.getElementById('activityName').value,
        partnerName: document.getElementById('partnerName').value,
        partnerAddress: document.getElementById('partnerAddress').value,
        partnerEmail: document.getElementById('partnerEmail').value,
        letterDate: document.getElementById('letterDate').value,
        schedules,
        startDate: schedules[0]?.startDate || '',
        endDate: schedules[schedules.length - 1]?.endDate || schedules[schedules.length - 1]?.startDate || '',
        activityTime: '',
        activityPlace: schedules[0]?.place || '',
        signerName: document.getElementById('signerName').value,
        signerId: document.getElementById('signerId').value,
        signerRole: document.getElementById('signerRole').value,
        honor: document.getElementById('honor').value,
        travel: document.getElementById('travel').value,
        employees: this.collectEmployees()
      };
    },

    updateReview() {
      const type = document.getElementById('activityType').value || 'Belum dipilih';
      const name = document.getElementById('activityName').value || 'Permohonan baru';
      const documents = this.collectDocuments();
      const employees = this.collectEmployees();
      const schedules = this.collectSchedules();
      document.getElementById('reviewTitle').textContent = name;
      document.getElementById('reviewContent').innerHTML = [
        ['Tipe kegiatan', type],
        ['Dokumen', documents.map(item => item.type).join(', ') || 'Belum dipilih'],
        ['Jadwal', schedules.map(schedule => this.scheduleLabel_(schedule)).join('\n') || 'Belum diisi'],
        ['Petugas / narasumber', employees.length + ' orang'],
        ['Honor', document.getElementById('honor').value],
        ['Perjalanan dinas', document.getElementById('travel').value]
      ].map(item => `<div class="review-line"><span>${this.escape(item[0])}</span><strong>${this.escape(item[1]).replace(/\n/g, '<br>')}</strong></div>`).join('');
    },

    async saveRequest(event) {
      event.preventDefault();
      const submitter = event.submitter;
      const status = submitter?.dataset.saveStatus || 'DRAFT';
      const payload = this.collectForm(status);
      if (!this.validateBeforeSubmit(status, payload)) return;
      this.setBusy(submitter, true, 'Menyimpan...');
      try {
        const result = await this.server('saveRequest', payload);
        this.toast(
          status === 'READY'
            ? 'Permohonan ' + result.id + ' siap diproses.'
            : 'Draft permohonan ' + result.id + ' tersimpan.'
        );
        this.state.travelLoaded = false;
        await this.refreshAll(false);
        this.resetForm();
        this.switchView(status === 'READY' ? 'requests' : 'dashboard');
      } catch (error) {
        this.toast(error.message, true);
        this.focusFirstInvalid();
      } finally {
        this.setBusy(submitter, false);
      }
    },

    resetForm() {
      document.getElementById('requestForm').reset();
      document.getElementById('requestId').value = '';
      document.getElementById('requestRevision').value = '';
      document.getElementById('clientToken').value = this.uuid();
      document.getElementById('scheduleList').innerHTML = '';
      document.getElementById('employeeList').innerHTML = '';
      this.addSchedule();
      this.addEmployee();
      const today = this.localDateIso();
      document.getElementById('letterDate').value = today;
      this.renderDocumentChoices([]);
      this.updateFormVisibility();
    },

    async openRequestDetail(requestId) {
      document.getElementById('drawerTitle').textContent = requestId;
      document.getElementById('drawerBody').innerHTML = '<div class="skeleton" style="height:180px;border-radius:14px"></div>';
      document.getElementById('detailDrawer').classList.add('is-open');
      document.getElementById('detailDrawer').setAttribute('aria-hidden', 'false');
      document.getElementById('drawerBackdrop').classList.remove('is-hidden');
      try {
        const detail = await this.server('getRequestDetail', requestId);
        this.state.currentDetail = detail;
        this.renderDetail(detail);
      } catch (error) {
        document.getElementById('drawerBody').innerHTML = `<div class="notice notice-error">${this.escape(error.message)}</div>`;
      }
    },

    closeDrawer() {
      document.getElementById('detailDrawer').classList.remove('is-open');
      document.getElementById('detailDrawer').setAttribute('aria-hidden', 'true');
      document.getElementById('drawerBackdrop').classList.add('is-hidden');
    },

    renderDetail(detail) {
      const request = detail.request;
      const detailDocuments = this.asArray(detail.documents);
      const progress = request.documentProgress || this.summarizeDocumentProgress_(detailDocuments, request.status);
      document.getElementById('drawerTitle').textContent = request.id;
      const documents = detailDocuments.map(doc => `
        <div class="document-item">
          <div class="document-item-head">
            <div><strong>${this.escape(doc.type)}</strong><small>${this.escape(doc.number || 'Nomor surat belum diisi')}</small></div>
            ${this.documentStatusBadge_(doc, request.status)}
          </div>
          <div class="document-links">
            ${doc.docUrl ? `<a class="button button-secondary button-small" href="${this.escape(doc.docUrl)}" target="_blank">Buka Doc</a>` : ''}
            ${doc.pdfUrl ? `<a class="button button-secondary button-small" href="${this.escape(doc.pdfUrl)}" target="_blank">PDF</a>` : ''}
          </div>
        </div>
      `).join('');
      const employees = detail.employees.map(item => `<li>${this.escape(item.name)}${item.identifier ? ' · ' + this.escape(item.identifier) : ''}${item.email ? ' · ' + this.escape(item.email) : ''}</li>`).join('');
      const schedules = this.asArray(detail.schedules).map((item, index) =>
        `<li><strong>Sesi ${index + 1}</strong><br>${this.escape(this.scheduleLabel_(item))}</li>`
      ).join('');
      document.getElementById('drawerBody').innerHTML = `
        <div class="detail-hero">
          <p class="eyebrow">${this.escape(request.activityType)}</p>
          <h3>${this.escape(request.activityName)}</h3>
          <p>${this.escape(request.partnerName)}</p>
          <div class="status-stack detail-status">${this.requestWorkflowBadges_(request)}</div>
        </div>
        <div class="workflow-notice workflow-${this.escape(String(request.status || 'DRAFT').toLowerCase())}">
          ${this.escape(this.requestStatusMessage_(request.status, progress))}
        </div>
        ${this.renderPrimaryActions_(request, progress)}
        ${this.renderDocumentToolbar_(detailDocuments, request)}
        ${this.renderFinanceToolbar_(request)}
        <section class="detail-section">
          <div class="detail-section-head">
            <h3>Ringkasan Permohonan</h3>
          </div>
          <div class="detail-grid">
            <div><span>Honor</span><strong>${this.escape(request.honor)}</strong></div>
            <div><span>Perjadin</span><strong>${this.escape(request.travel)}</strong></div>
            <div class="detail-wide">
              <span>Jadwal kegiatan</span>
              <ol class="compact-schedule-list">${schedules || '<li>Belum ada jadwal.</li>'}</ol>
            </div>
          </div>
        </section>
        <section class="detail-section"><h3>Dokumen</h3><div class="document-list">${documents || '<p>Belum ada dokumen.</p>'}</div></section>
        <section class="detail-section"><h3>Petugas / Narasumber</h3><ol>${employees || '<li>Belum ada data.</li>'}</ol></section>
        <section class="detail-section">
          <h3>Penerima email gabungan</h3>
          <p><strong>To:</strong><br>${this.escape(request.emailTo || '-').replace(/\n/g, '<br>')}</p>
          <p><strong>CC:</strong><br>${this.escape(request.emailCc || '-').replace(/\n/g, '<br>')}</p>
          ${request.emailNote ? `<div class="notice notice-error">${this.escape(request.emailNote)}</div>` : ''}
        </section>
      `;
    },

    renderPrimaryActions_(request, progress) {
      if (request.status === 'ARCHIVED') return '';
      const actions = [];
      if (request.status === 'READY' && progress.status !== 'DRAFTED') {
        actions.push('<button class="button button-primary" data-action="process-all">Buat semua Doc, PDF & draft Gmail</button>');
      }
      actions.push('<button class="button button-secondary" data-action="edit-request">Ubah permohonan</button>');
      if (request.status === 'READY' && progress.status === 'DRAFTED') {
        actions.push('<button class="button button-secondary" data-action="archive-request">Tandai Selesai</button>');
      }
      return `<div class="action-panel">${actions.join('')}</div>`;
    },

    renderDocumentToolbar_(documents, request) {
      if (!documents.length || request.status !== 'READY') return '';
      const options = documents.map(doc => `
        <option value="${this.escape(doc.id)}">${this.escape(doc.type)}${doc.number ? ' | ' + this.escape(doc.number) : ''}</option>
      `).join('');
      return `
        <section class="detail-section action-section">
          <h3>Proses satu dokumen</h3>
          <div class="toolbar-row">
            <select data-detail-document-select aria-label="Pilih dokumen">${options}</select>
            <button class="button button-primary" data-action="generate-doc">Buat Doc & PDF</button>
            <button class="button button-secondary" data-action="preview-email">Preview email</button>
            <button class="button button-secondary" data-action="draft-email">Buat draft Gmail</button>
          </div>
        </section>
      `;
    },

    renderFinanceToolbar_(request) {
      if (request.status !== 'READY') return '';
      const kinds = [];
      if (request.honor === 'Ya') kinds.push(['HONOR', 'Honor']);
      if (request.travel === 'Ya') kinds.push(['PERJADIN', 'Perjadin']);
      if (!kinds.length) return '';
      const options = kinds.map(item => `<option value="${item[0]}">${item[1]}</option>`).join('');
      return `
        <section class="detail-section action-section">
          <h3>Aksi keuangan</h3>
          <div class="toolbar-row">
            <select data-finance-kind-select aria-label="Pilih laporan">${options}</select>
            <button class="button button-primary" data-action="generate-finance">Buka sheet</button>
            <button class="button button-secondary" data-action="export-finance" data-format="PDF">PDF</button>
            <button class="button button-secondary" data-action="export-finance" data-format="XLSX">Excel</button>
          </div>
        </section>
      `;
    },

    async handleDetailAction(event) {
      const button = event.target.closest('[data-action]');
      if (!button || !this.state.currentDetail) return;
      const request = this.state.currentDetail.request;
      const action = button.dataset.action;
      try {
        if (action === 'edit-request') {
          this.fillForm(this.state.currentDetail);
          this.closeDrawer();
          this.switchView('form');
          return;
        }
        if (action === 'archive-request') {
          if (!confirm(
            'Tandai permohonan ' + request.id + ' sebagai selesai? ' +
            'Permohonan akan menjadi hanya-baca dan dipindahkan dari daftar aktif.'
          )) return;
          this.setBusy(button, true, 'Menyelesaikan...');
          await this.server('archiveRequest', request.id, request.revision);
          this.toast('Permohonan ditandai selesai.');
          this.state.travelLoaded = false;
          this.closeDrawer();
          await this.refreshAll(false);
          return;
        }
        if (action === 'generate-doc') {
          const documentId = button.dataset.documentId || this.selectedDetailDocumentId_();
          this.setBusy(button, true, 'Membuat...');
          await this.server('generateDocument', documentId, false);
          this.toast('Dokumen dan PDF siap.');
        }
        if (action === 'preview-email') {
          await this.openEmailPreview(button.dataset.documentId || this.selectedDetailDocumentId_());
          return;
        }
        if (action === 'draft-email') {
          const documentId = button.dataset.documentId || this.selectedDetailDocumentId_();
          this.setBusy(button, true, 'Membuat draft...');
          await this.server('createEmailDraft', documentId, false);
          this.toast('Draft Gmail siap.');
        }
        if (action === 'process-all') {
          this.setBusy(button, true, 'Membuat dokumen & draft...');
          const result = await this.server('processRequest', request.id);
          await this.openRequestDetail(request.id);
          if (!result.ok) {
            this.toast(
              'Sebagian proses gagal:\n' +
              result.errors.map(item => item.type + ' (' + item.stage + '): ' + item.error).join('\n'),
              true
            );
            return;
          }
          this.toast('Semua Doc, PDF, dan draft Gmail siap.');
          return;
        }
        if (action === 'generate-finance') {
          const kind = button.dataset.kind || this.selectedFinanceKind_();
          const outputWindow = window.open('', '_blank');
          this.setBusy(button, true, 'Membuat sheet...');
          const result = await this.server('generateFinanceSheet', request.id, kind);
          if (outputWindow) outputWindow.location = result.url;
          else window.open(result.url, '_blank');
          this.toast('Sheet ' + kind.toLowerCase() + ' siap.');
        }
        if (action === 'export-finance') {
          const kind = button.dataset.kind || this.selectedFinanceKind_();
          const outputWindow = window.open('', '_blank');
          this.setBusy(button, true, 'Mengekspor...');
          const result = await this.server(
            'generateAndExportFinance',
            request.id,
            kind,
            button.dataset.format
          );
          if (outputWindow) outputWindow.location = result.url;
          else window.open(result.url, '_blank');
          this.toast(result.format + ' siap.');
        }
        await this.openRequestDetail(request.id);
      } catch (error) {
        this.toast(error.message, true);
      } finally {
        this.setBusy(button, false);
      }
    },

    selectedDetailDocumentId_() {
      const documentId = document.querySelector('[data-detail-document-select]')?.value;
      if (!documentId) throw new Error('Pilih dokumen terlebih dahulu.');
      return documentId;
    },

    selectedFinanceKind_() {
      const kind = document.querySelector('[data-finance-kind-select]')?.value;
      if (!kind) throw new Error('Pilih jenis laporan terlebih dahulu.');
      return kind;
    },

    fillForm(detail) {
      this.resetForm();
      const request = detail.request;
      const values = {
        requestId: request.id,
        requestRevision: request.revision,
        clientToken: request.clientToken,
        activityType: request.activityType,
        speakerSubtype: request.speakerSubtype,
        incomingNumber: request.incomingNumber,
        incomingDate: request.incomingDate,
        incomingSender: request.incomingSender,
        incomingSubject: request.incomingSubject,
        activityName: request.activityName,
        partnerName: request.partnerName,
        partnerAddress: request.partnerAddress,
        partnerEmail: request.partnerEmail,
        letterDate: request.letterDate,
        signerName: request.signerName,
        signerId: request.signerId,
        signerRole: request.signerRole,
        honor: request.honor,
        travel: request.travel
      };
      Object.keys(values).forEach(id => {
        const input = document.getElementById(id);
        if (input) input.value = values[id] == null ? '' : values[id];
      });
      document.getElementById('scheduleList').innerHTML = '';
      const schedules = this.asArray(detail.schedules);
      schedules.forEach(schedule => this.addSchedule(schedule));
      if (!schedules.length) {
        this.addSchedule({
          startDate: request.startDate,
          endDate: request.endDate,
          place: request.activityPlace
        });
      }
      this.renderDocumentChoices(detail.documents);
      const statusInput = document.querySelector(`input[name="speakerStatus"][value="${CSS.escape(request.speakerStatus || '')}"]`);
      if (statusInput) statusInput.checked = true;
      const faculties = this.asArray(request.faculties);
      document.querySelectorAll('input[name="faculty"]').forEach(input => input.checked = faculties.includes(input.value));
      document.getElementById('employeeList').innerHTML = '';
      detail.employees.forEach(employee => this.addEmployee(employee));
      if (!detail.employees.length) this.addEmployee();
      this.updateFormVisibility(false);
      this.updateReview();
    },

    async openEmailPreview(documentId) {
      const modal = document.getElementById('emailModal');
      document.getElementById('emailModalTitle').textContent = 'Memuat...';
      document.getElementById('emailModalBody').innerHTML = '<div class="skeleton" style="height:180px;border-radius:14px"></div>';
      modal.showModal();
      try {
        const preview = await this.server('previewEmail', documentId);
        document.getElementById('emailModalTitle').textContent = preview.type;
        document.getElementById('emailModalBody').innerHTML = `
          <div class="email-envelope">
            <div><span>To</span>${this.escape(preview.to.join(', '))}</div>
            <div><span>CC</span>${this.escape(preview.cc.join(', ') || '-')}</div>
            <div><span>Subjek</span><strong>${this.escape(preview.subject)}</strong></div>
            <div><span>Lampiran</span>${preview.hasAttachment ? 'PDF siap' : 'PDF belum dibuat'}</div>
          </div>
          ${preview.notes.length ? `<div class="notice notice-error">${this.escape(preview.notes.join('\n'))}</div>` : ''}
          <iframe class="email-preview-frame" sandbox="" referrerpolicy="no-referrer" srcdoc="${this.escape(this.emailPreviewDocument(preview.htmlBody))}"></iframe>
        `;
      } catch (error) {
        document.getElementById('emailModalBody').innerHTML = `<div class="notice notice-error">${this.escape(error.message)}</div>`;
      }
    },

    async loadTravel() {
      try {
        const result = await this.server('listTravelData', {});
        this.state.travel = result.items;
        this.state.travelLoaded = true;
        this.renderTravel(result.items);
      } catch (error) {
        this.toast(error.message, true);
      }
    },

    renderTravel(items) {
      document.getElementById('travelTableBody').innerHTML = items.map(item => `
        <tr>
          <td data-label="Permohonan">${this.escape(item.requestId)}</td>
          <td data-label="Nama"><span class="table-primary">${this.escape(item.name)}</span><span class="table-secondary">${this.escape(item.identifier || '-')}</span></td>
          <td data-label="Kategori">${this.escape(item.category || '-')}</td>
          <td data-label="Tempat">${this.escape(item.place || '-')}</td>
          <td data-label="Total">${this.currency(item.total)}</td>
          <td data-label="Aksi"><button class="button button-secondary button-small" data-travel-key="${this.escape(item.participantKey)}">Edit biaya</button></td>
        </tr>
      `).join('');
      document.getElementById('travelEmpty').classList.toggle('is-hidden', items.length > 0);
    },

    async syncAndLoadTravel(showToast = false) {
      try {
        const result = await this.server('syncTravelData', '');
        if (showToast) this.toast(result.synced + ' data perjadin disinkronkan.');
        await this.loadTravel();
      } catch (error) {
        this.toast(error.message, true);
      }
    },

    async preloadTravelData() {
      try {
        await this.server('syncTravelData', '');
        this.setBootProgress(86, 'Memuat data biaya...');
        await this.loadTravel();
      } catch (error) {
        this.state.travelLoaded = false;
        this.toast('Data biaya belum termuat: ' + error.message, true);
      }
    },

    openTravelModal(participantKey) {
      const item = this.state.travel.find(row => row.participantKey === participantKey);
      if (!item) return;
      this.state.currentTravel = item;
      const labels = ['Uang kegiatan', 'Uang saku', 'Uang makan', 'Uang penginapan', 'Transportasi dalam kota', 'Transportasi antar kota', 'Transportasi antar negara PP', 'Aplikasi visa', 'Asuransi perjalanan', 'Fiskal & pajak bandara', 'Uang harian'];
      document.getElementById('travelModalTitle').textContent = item.name;
      document.getElementById('travelModalBody').innerHTML = `
        <div class="cost-grid">
          ${labels.map((label, index) => `<label class="field"><span>${this.escape(label)}</span><input type="number" min="0" step="1000" data-cost-index="${index}" value="${Number(this.asArray(item.costs)[index] || 0)}"></label>`).join('')}
        </div>
      `;
      document.getElementById('travelModal').showModal();
    },

    async saveTravelCosts(event) {
      event.preventDefault();
      const button = event.submitter;
      const item = this.state.currentTravel;
      if (!item) return;
      const costs = Array.from(document.querySelectorAll('[data-cost-index]')).map(input => Number(input.value || 0));
      this.setBusy(button, true, 'Menyimpan...');
      try {
        await this.server('saveTravelCosts', { participantKey: item.participantKey, costs });
        document.getElementById('travelModal').close();
        this.toast('Biaya perjadin tersimpan.');
        await this.loadTravel();
      } catch (error) {
        this.toast(error.message, true);
      } finally {
        this.setBusy(button, false);
      }
    },

    async refreshAll(showToast = true) {
      const button = document.getElementById('refreshButton');
      this.setBusy(button, true, 'Memuat...');
      try {
        const data = await this.server('refreshBootstrapData');
        this.state.bootstrap = data;
        this.state.requests = data.requests || [];
        this.setEmployeeCatalog_((data.options || {}).employeeCatalog || []);
        this.renderDashboard(data.summary, this.state.requests);
        if (this.state.activeView === 'requests') {
          await this.loadRequests();
        } else {
          this.renderRequests(this.state.requests);
        }
        this.renderReferences(data.references);
        if (showToast) this.toast('Data diperbarui.');
      } catch (error) {
        this.toast(error.message, true);
      } finally {
        this.setBusy(button, false);
      }
    },

    async handleAdminAction(button) {
      if (!document.body.classList.contains('is-admin')) {
        this.toast('Aksi ini hanya untuk Admin.', true);
        return;
      }
      const action = button.dataset.adminAction;
      this.setBusy(button, true, 'Memproses...');
      try {
        if (action === 'system-status') {
          const result = await this.server('getSystemStatus');
          this.renderAdminObject('Status sistem', result);
        }
        if (action === 'setup-system') {
          if (!confirm('Jalankan setupSystem? Header sheet dan konfigurasi dasar akan diperiksa/dilengkapi.')) return;
          const result = await this.server('setupSystem');
          this.renderAdminObject('Setup struktur', result);
        }
        if (action === 'preview-migration') {
          const result = await this.server('previewLegacyMigration');
          this.renderAdminObject('Preview migrasi', result);
        }
        if (action === 'run-migration') {
          const confirmation = prompt(
            'Migrasi akan membuat backup dan mengubah struktur data. Ketik MIGRATE untuk melanjutkan.'
          );
          if (confirmation === null) return;
          if (confirmation.trim() !== 'MIGRATE') {
            throw new Error('Migrasi dibatalkan. Konfirmasi harus tepat: MIGRATE');
          }
          const result = await this.server('migrateLegacyData', confirmation.trim());
          this.renderAdminObject('Hasil migrasi', result);
          this.toast('Migrasi selesai.');
          await this.refreshAll(false);
        }
        if (action === 'cleanup-autocrat') {
          if (!confirm('Hapus kolom Autocrat AM-BV dari Master Permohonan? Backup tersembunyi akan dibuat terlebih dahulu.')) return;
          const result = await this.server('cleanupMigratedAutocratColumns');
          this.renderAdminObject('Cleanup kolom Autocrat', result);
          this.toast(result.message || 'Kolom Autocrat berhasil dibersihkan.');
          await this.refreshAll(false);
        }
        if (action === 'repair-master') {
          if (!confirm('Repair ID Master kosong? Jalankan hanya saat dibutuhkan.')) return;
          const result = await this.server('repairMigratedMasterIds');
          this.renderAdminObject('Repair ID Master', result);
        }
        if (action === 'repair-employee') {
          if (!confirm('Repair ID Pegawai hasil migrasi? Jalankan hanya saat dibutuhkan.')) return;
          const result = await this.server('repairMigratedEmployeeIds');
          this.renderAdminObject('Repair ID Pegawai', result);
        }
        if (action === 'preview-cleanup') {
          const result = await this.server('previewGeneratedSheetCleanup');
          this.renderGeneratedSheetCleanup(result || []);
        }
        if (action === 'delete-generated') {
          const selected = Array.from(document.querySelectorAll('[data-generated-sheet]:checked'))
            .map(input => input.value);
          if (!selected.length) throw new Error('Pilih minimal satu sheet generate dari hasil tinjauan.');
          if (!confirm('Hapus sheet generate terpilih? Data di sheet tersebut akan hilang dari spreadsheet.')) return;
          const result = await this.server('deleteGeneratedSheets', selected);
          this.renderAdminObject('Hapus sheet generate', result);
        }
      } catch (error) {
        this.toast(error.message, true);
      } finally {
        this.setBusy(button, false);
      }
    },

    renderAdminObject(title, result) {
      document.getElementById('adminResult').innerHTML = `
        <div class="admin-output">
          <h3>${this.escape(title)}</h3>
          <pre>${this.escape(JSON.stringify(result, null, 2))}</pre>
        </div>
      `;
    },

    renderGeneratedSheetCleanup(items) {
      document.getElementById('adminResult').innerHTML = `
        <div class="admin-output">
          <h3>Sheet generate</h3>
          ${items.length ? items.map(item => `
            <label class="cleanup-item">
              <input type="checkbox" data-generated-sheet value="${this.escape(item.name)}">
              <span>${this.escape(item.name)}</span>
            </label>
          `).join('') : '<p class="helper-text">Tidak ada sheet generate yang bisa dibersihkan.</p>'}
        </div>
      `;
    },

    requestStatusBadge_(status) {
      const clean = String(status || 'DRAFT').toUpperCase();
      const meta = {
        DRAFT: ['draft', 'Draft'],
        READY: ['ready', 'Siap Diproses'],
        ARCHIVED: ['archived', 'Selesai']
      }[clean] || ['pending', clean];
      return this.statusPill_(meta[0], meta[1]);
    },

    documentProgressBadge_(progress) {
      const clean = String((progress || {}).status || 'NOT_CREATED').toUpperCase();
      const meta = {
        NOT_CREATED: ['pending', 'Dokumen Belum Dibuat'],
        IN_PROGRESS: ['generated', 'Sebagian Diproses'],
        GENERATED: ['generated', 'Doc & PDF Dibuat'],
        DRAFTED: ['drafted', 'Draft Email Dibuat'],
        ERROR: ['error', 'Gagal Generate'],
        COMPLETE: ['archived', 'Selesai / Diarsipkan']
      }[clean] || ['pending', clean];
      return this.statusPill_(meta[0], meta[1]);
    },

    documentStatusBadge_(document, requestStatus) {
      if (String(requestStatus || '').toUpperCase() === 'ARCHIVED') {
        return this.statusPill_('archived', 'Selesai / Diarsipkan');
      }
      if (String(document.status || '').toUpperCase() === 'ERROR') {
        return this.statusPill_('error', 'Gagal Generate');
      }
      if (String(document.emailStatus || '').toUpperCase() === 'DRAFTED') {
        return this.statusPill_('drafted', 'Draft Email Dibuat');
      }
      if (String(document.status || '').toUpperCase() === 'GENERATED') {
        return this.statusPill_('generated', 'Doc & PDF Dibuat');
      }
      return this.statusPill_('pending', 'Belum Dibuat');
    },

    requestWorkflowBadges_(request) {
      const requestBadge = this.requestStatusBadge_(request.status);
      if (String(request.status || '').toUpperCase() === 'ARCHIVED') return requestBadge;
      const progress = request.documentProgress || this.summarizeDocumentProgress_([], request.status);
      return requestBadge + this.documentProgressBadge_(progress);
    },

    summarizeDocumentProgress_(documents, requestStatus) {
      const summary = {
        total: documents.length,
        notCreated: 0,
        generated: 0,
        failed: 0,
        drafted: 0,
        status: 'NOT_CREATED'
      };
      documents.forEach(document => {
        if (document.status === 'ERROR') summary.failed++;
        else if (document.status === 'GENERATED') summary.generated++;
        else summary.notCreated++;
        if (document.emailStatus === 'DRAFTED') summary.drafted++;
      });
      if (requestStatus === 'ARCHIVED') summary.status = 'COMPLETE';
      else if (summary.failed) summary.status = 'ERROR';
      else if (!summary.total || summary.notCreated === summary.total) summary.status = 'NOT_CREATED';
      else if (summary.drafted === summary.total) summary.status = 'DRAFTED';
      else if (summary.generated === summary.total) summary.status = 'GENERATED';
      else summary.status = 'IN_PROGRESS';
      return summary;
    },

    requestStatusMessage_(status, progress) {
      if (status === 'ARCHIVED') {
        return 'Permohonan telah selesai dan bersifat hanya-baca.';
      }
      if (status === 'DRAFT') {
        return 'Data masih dapat diubah. Lengkapi lalu tandai Siap Diproses sebelum membuat dokumen.';
      }
      if (progress.status === 'DRAFTED') {
        return 'Seluruh Doc, PDF, dan draft Gmail tersedia. Permohonan dapat ditandai selesai.';
      }
      if (progress.status === 'ERROR') {
        return 'Ada dokumen yang gagal dibuat. Periksa status dokumen lalu jalankan proses kembali.';
      }
      return 'Data sudah tervalidasi dan siap dibuat menjadi Doc, PDF, serta draft Gmail.';
    },

    statusPill_(className, label) {
      return `<span class="status status-${this.escape(className)}">${this.escape(label)}</span>`;
    },

    setBusy(button, busy, label) {
      if (!button) return;
      if (busy) {
        button.dataset.originalHtml = button.innerHTML;
        button.setAttribute('aria-busy', 'true');
        if (!button.classList.contains('icon-button')) {
          button.textContent = label || 'Memproses...';
        }
        button.disabled = true;
      } else {
        if (button.dataset.originalHtml) button.innerHTML = button.dataset.originalHtml;
        button.removeAttribute('aria-busy');
        button.disabled = false;
        this.refreshIcons();
      }
    },

    focusFirstInvalid() {
      const invalid = document.querySelector('#requestForm :invalid');
      if (invalid) {
        invalid.focus();
        invalid.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    },

    showGlobalError(error) {
      const box = document.getElementById('globalError');
      box.textContent = error.message || String(error);
      box.classList.remove('is-hidden');
    },

    toast(message, isError = false) {
      const toast = document.createElement('div');
      toast.className = 'toast' + (isError ? ' is-error' : '');
      toast.textContent = message;
      document.getElementById('toastRegion').appendChild(toast);
      setTimeout(() => toast.remove(), 5200);
    },

    currency(value) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(Number(value || 0));
    },

    validateBeforeSubmit(status, payload) {
      if (status !== 'READY') return true;
      const form = document.getElementById('requestForm');
      if (!form.checkValidity()) {
        form.reportValidity();
        return false;
      }
      const errors = [];
      if (!payload.documents.length) errors.push('Pilih minimal satu dokumen.');
      if (!payload.schedules.length) errors.push('Minimal satu sesi jadwal wajib diisi.');
      payload.schedules.forEach((schedule, index) => {
        if (!schedule.startDate) errors.push('Tanggal sesi ke-' + (index + 1) + ' wajib diisi.');
        if (!schedule.place) errors.push('Tempat sesi ke-' + (index + 1) + ' wajib diisi.');
        if (schedule.startDate && schedule.endDate && schedule.endDate < schedule.startDate) {
          errors.push('Tanggal selesai sesi ke-' + (index + 1) + ' tidak boleh sebelum tanggal mulai.');
        }
        if (schedule.startTime && schedule.endTime && schedule.endTime < schedule.startTime) {
          errors.push('Waktu selesai sesi ke-' + (index + 1) + ' tidak boleh sebelum waktu mulai.');
        }
      });
      payload.documents.forEach(document => {
        if (!document.number) errors.push('Nomor surat wajib: ' + document.type);
      });
      const needsPeople = payload.documents.some(document => document.type === 'Surat Tugas') ||
        (payload.documents.some(document => document.type === 'Surat Permohonan Narasumber kepada Dekan') &&
          payload.speakerStatus === 'Tidak Dicarikan');
      if (needsPeople && !payload.employees.length) errors.push('Minimal satu pegawai/narasumber wajib diisi.');
      if (payload.activityType === 'Penugasan Narasumber' && !payload.speakerSubtype) {
        errors.push('Sub-tipe narasumber wajib diisi.');
      }
      if (payload.documents.some(document => document.type === 'Surat Permohonan Narasumber kepada Dekan')) {
        if (!payload.speakerStatus) errors.push('Status narasumber wajib diisi.');
        if (!payload.faculties.length) errors.push('Fakultas tujuan wajib dipilih.');
      }
      if (payload.travel === 'Ya') {
        payload.employees.forEach((employee, index) => {
          if (!employee.rank || !employee.category) {
            errors.push('Pangkat dan kategori perjadin wajib untuk orang ke-' + (index + 1) + '.');
          }
        });
      }
      if (errors.length) {
        this.toast(errors.join('\n'), true);
        return false;
      }
      return true;
    },

    localDateIso(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    },

    asArray(value) {
      return Array.isArray(value) ? value : [];
    },

    emailPreviewDocument(htmlBody) {
      return '<!doctype html><html><head><base target="_blank"><meta charset="UTF-8">' +
        '<style>body{font:14px/1.6 Arial,sans-serif;color:#172321;margin:0;padding:16px}a{color:#015850}</style>' +
        '</head><body>' + String(htmlBody || '') + '</body></html>';
    },

    setBootProgress(value, text) {
      const percent = Math.max(0, Math.min(100, Number(value) || 0));
      const bar = document.getElementById('bootProgressBar');
      const label = document.getElementById('bootProgressValue');
      const message = document.getElementById('bootProgressText');
      if (bar) bar.style.width = percent + '%';
      if (label) label.textContent = Math.round(percent) + '%';
      if (message && text) message.textContent = text;
    },

    escape(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    },

    uuid() {
      return window.crypto && crypto.randomUUID
        ? crypto.randomUUID()
        : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, character => {
            const random = Math.random() * 16 | 0;
            return (character === 'x' ? random : (random & 3 | 8)).toString(16);
          });
    }
  };

  document.addEventListener('DOMContentLoaded', () => App.init());
</script>
